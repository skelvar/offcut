name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22+ required: bench/tasks/one-impl-store/accept.mjs runs a TypeScript
          # fixture via --experimental-strip-types, which Node 20 does not have.
          # The shipped hooks are plain ESM and run on 20; only the bench needs 22.
          node-version: '22'

      - name: Unit and contract tests
        run: node --test tests/*.test.js

      - name: AGENTS.md must not be stale
        run: |
          node scripts/build-agents-md.js
          git diff --exit-code -- AGENTS.md

      - name: Versions must match
        run: |
          node -e '
            const fs = require("fs");
            const ver = JSON.parse(fs.readFileSync("plugin.json","utf8")).version;
            const cp = JSON.parse(fs.readFileSync(".claude-plugin/plugin.json","utf8"));
            const cursor = JSON.parse(fs.readFileSync(".cursor-plugin/plugin.json","utf8"));
            const m = JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json","utf8"));
            if (cp.version !== ver) throw new Error(".claude-plugin/plugin.json mismatch");
            if (cursor.version !== ver) throw new Error(".cursor-plugin/plugin.json mismatch");
            if (m.plugins[0].version !== ver) throw new Error("marketplace mismatch");
            // Every directory under skills/ is auto-discovered and installed, so
            // checking only skills/offcut let the command skills drift to 0.3.0.
            const skills = fs.readdirSync("skills", { withFileTypes: true }).filter((e) => e.isDirectory());
            if (!skills.length) throw new Error("no skills found");
            for (const s of skills) {
              const src = fs.readFileSync("skills/" + s.name + "/SKILL.md", "utf8");
              const got = (src.match(/version:\s*"([^"]+)"/) || [])[1];
              if (got !== ver) throw new Error(s.name + " is " + got + ", expected " + ver);
            }
            console.log("version", ver, "across", skills.length, "skills");
          '

      - name: No host identifiers outside host.js and adapters/
        run: |
          if grep -RInE '\b(claude|codex|grok|cursor)\b' hooks \
            --exclude='host.js' \
            --exclude-dir='*' 2>/dev/null; then
            echo "Host identifier found outside hooks/host.js"
            exit 1
          fi
          # Broader: any tracked file under hooks/ except host.js
          ! grep -RInE '\b(claude|codex|grok|cursor)\b' hooks --exclude=host.js

      - name: Zero runtime dependencies
        run: |
          if [ -f package.json ]; then
            node -e '
              const p = require("./package.json");
              const deps = Object.assign({}, p.dependencies, p.optionalDependencies);
              if (Object.keys(deps).length) {
                console.error(deps);
                process.exit(1);
              }
            '
          fi
          test ! -d node_modules || (echo "node_modules must not ship" && exit 1)

      - name: Adapter scripts exist
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("adapters/claude/hooks.json","utf8"));
            for (const [event, groups] of Object.entries(cfg.hooks)) {
              for (const g of groups) {
                for (const h of g.hooks) {
                  if (h.args) throw new Error(event+": args array breaks Grok (use single command string)");
                  const m = String(h.command||"").match(/\$\{CLAUDE_PLUGIN_ROOT\}\/([^"]+)/);
                  if (!m) throw new Error(event+": missing ${CLAUDE_PLUGIN_ROOT}/path in "+h.command);
                  if (!fs.existsSync(m[1])) throw new Error("missing "+m[1]+" for "+event);
                }
              }
            }
            console.log("adapter paths ok");
          '
