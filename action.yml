name: Offcut scan
description: Deterministic over-engineering check on a pull request diff. No model, no network, no dependencies.
branding:
  icon: scissors
  color: gray-dark
inputs:
  base:
    description: Git ref to diff against. Defaults to the pull request base branch.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Scan pull request diff
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        PR_BASE_REF: ${{ github.base_ref }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        base="${INPUT_BASE:-origin/${PR_BASE_REF}}"
        if [ -z "${PR_BASE_REF}" ] && [ -z "${INPUT_BASE}" ]; then
          echo "::notice::Offcut scan runs on pull_request events or with an explicit base input; nothing to diff." 
          exit 0
        fi
        git fetch --no-tags --quiet origin "${base#origin/}" || true
        diff="$(git diff --merge-base "$base" HEAD || git diff "$base" HEAD)"
        out="$(printf '%s' "$diff" | node "$ACTION_PATH/scripts/scan.mjs" --diff - --format github)"
        printf '%s\n' "$out"
        {
          echo "## Offcut scan"
          echo
          echo '```'
          printf '%s' "$diff" | node "$ACTION_PATH/scripts/scan.mjs" --diff -
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
